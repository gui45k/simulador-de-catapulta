<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulador de Catapulta</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e9eef0;--panel:#f8fafb;--ink:#14303b;--mut:#4d6872;--line:#9fb4bd;--a:#d1491f;--b:#1d6fa5;--gr:#5b4a3a;--ok:#2d7a4b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a21;--panel:#15252e;--ink:#dbe8ec;--mut:#8fa9b3;--line:#3a5561;--a:#ff7a4d;--b:#5bb4ee;--gr:#a58b72;--ok:#6fd195}}
:root[data-theme="dark"]{--bg:#0e1a21;--panel:#15252e;--ink:#dbe8ec;--mut:#8fa9b3;--line:#3a5561;--a:#ff7a4d;--b:#5bb4ee;--gr:#a58b72;--ok:#6fd195}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font:700 26px/1.2 Georgia,"Times New Roman",serif;margin:0 0 4px}
h2{font:700 17px/1.3 Georgia,serif;margin:0 0 8px}
header{padding:20px 20px 8px;max-width:1200px;margin:auto}
header p{margin:0;color:var(--mut);max-width:70ch}
main{display:grid;grid-template-columns:300px 1fr;gap:16px;padding:12px 20px 28px;max-width:1200px;margin:auto}
@media(max-width:820px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px}
label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:7px 0;font-size:14px}
label span small{color:var(--mut)}
input[type=number],select{width:104px;padding:5px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);font:inherit}
input[type=range]{width:100%}
.chk{justify-content:flex-start}
button{width:100%;margin-top:10px;padding:10px;border:0;border-radius:4px;background:var(--a);color:#fff;font:700 15px system-ui;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.wrap{display:flex;flex-direction:column;gap:16px;min-width:0}
canvas{width:100%;height:min(52vw,400px);min-height:260px;display:block;background:var(--panel);border:1px solid var(--line);border-radius:6px}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.res div{border-left:3px solid var(--line);padding-left:9px}
.res b{display:block;font:700 20px Georgia,serif;font-variant-numeric:tabular-nums}
.res small{color:var(--mut)}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:6px 20px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mut)}
.leg i{display:inline-block;width:22px;height:0;border-top:3px solid;vertical-align:middle;margin-right:5px}
#hit{font-weight:700}
</style>
</head>
<body>
<header>
<h1>Simulador de catapulta</h1>
<p>Ajuste o contrapeso, o ângulo e o ambiente. O alcance é calculado pelas fórmulas clássicas de lançamento oblíquo e comparado com uma integração numérica que inclui o arrasto do ar.</p>
</header>
<main>
<section class="panel" aria-label="Parâmetros">
<h2>Parâmetros</h2>
<label>Contrapeso <span><input id="mc" type="number" value="800" min="1" step="10"> <small>kg</small></span></label>
<label>Queda do contrapeso <span><input id="dh" type="number" value="3" min="0.1" step="0.1"> <small>m</small></span></label>
<label>Eficiência <span><input id="ef" type="number" value="30" min="1" max="100" step="1"> <small>%</small></span></label>
<label>Massa do projétil <span><input id="mp" type="number" value="20" min="0.1" step="0.5"> <small>kg</small></span></label>
<label>Altura de soltura <span><input id="h0" type="number" value="4" min="0" step="0.5"> <small>m</small></span></label>
<label>Ambiente <select id="gr"><option value="9.81|1.225">Terra</option><option value="3.71|0.02">Marte</option><option value="1.62|0">Lua (sem ar)</option></select></label>
<label>Alvo <span><input id="tg" type="number" value="120" min="1" step="5"> <small>m</small></span></label>
<label for="th">Ângulo de lançamento <span id="thv">45°</span></label>
<input id="th" type="range" min="5" max="85" value="45">
<label class="chk"><input id="dr" type="checkbox" checked> Considerar arrasto do ar</label>
<button id="go">Disparar</button>
</section>
<div class="wrap">
<canvas id="cv" role="img" aria-label="Trajetória da catapulta"></canvas>
<div class="leg"><span><i style="border-color:var(--a)"></i>Sem arrasto (fórmula)</span><span><i style="border-color:var(--b);border-top-style:dashed"></i>Com arrasto (numérico)</span><span id="hit"></span></div>
<section class="panel"><h2>Resultados</h2><div class="res" id="res"></div></section>
<section class="panel"><h2>Cálculo passo a passo</h2><div class="f" id="steps"></div></section>
</div>
</main>
<script>
const $=id=>document.getElementById(id),cv=$('cv'),cx=cv.getContext('2d');
let S,start=0,raf;
const f=(x,d=1)=>x.toLocaleString('pt-BR',{maximumFractionDigits:d,minimumFractionDigits:d});
function calc(){
 const n=i=>Math.max(parseFloat($(i).value)||0,0.0001),[g,rho]=$('gr').value.split('|').map(Number);
 const mc=n('mc'),dh=n('dh'),ef=Math.min(n('ef'),100)/100,mp=n('mp'),h0=parseFloat($('h0').value)||0,tg=n('tg'),dg=+$('th').value,th=dg*Math.PI/180;
 const v=Math.sqrt(2*ef*mc*g*dh/mp),vx=v*Math.cos(th),vy=v*Math.sin(th);
 const tt=(vy+Math.sqrt(vy*vy+2*g*h0))/g,R=vx*tt,hm=h0+vy*vy/(2*g),tp=vy/g,vi=Math.hypot(vx,vy-g*tt);
 const r=Math.cbrt(3*mp/(4*Math.PI*2500)),k=0.5*rho*0.47*Math.PI*r*r/mp,dt=0.005,P=[[0,h0]];
 let x=0,y=h0,ux=vx,uy=vy,t=0,Rd=0,td=0,hd=h0,vd=0;
 if($('dr').checked){
  while(t<600){const s=Math.hypot(ux,uy);ux-=k*s*ux*dt;uy-=(g+k*s*uy)*dt;const px=x,py=y;x+=ux*dt;y+=uy*dt;t+=dt;hd=Math.max(hd,y);
   if(y<=0){const q=py/(py-y);x=px+(x-px)*q;y=0;t-=dt*(1-q);P.push([x,0]);break}
   P.push([x,y])}
  Rd=x;td=t;vd=Math.hypot(ux,uy);
 }
 S={g,rho,mc,dh,ef,mp,h0,tg,dg,th,v,vx,vy,tt,R,hm,tp,vi,P,dt,Rd,td,hd,vd,r,drag:$('dr').checked};
 show();
}
function show(){
 const s=S,fin=s.drag?s.Rd:s.R;
 const c=[['Velocidade de saída',f(s.v)+' m/s'],['Alcance (sem ar)',f(s.R)+' m'],['Altura máxima',f(s.hm)+' m'],['Tempo de voo',f(s.tt,2)+' s'],['Velocidade no impacto',f(s.vi)+' m/s']];
 if(s.drag)c.push(['Alcance (com ar)',f(s.Rd)+' m'],['Perda por arrasto',f(100*(1-s.Rd/s.R),0)+' %']);
 $('res').innerHTML=c.map(a=>`<div><small>${a[0]}</small><b>${a[1]}</b></div>`).join('');
 $('steps').innerHTML=[
 `Energia: ηm<sub>c</sub>gΔh = ½m<sub>p</sub>v²`,
 `v = √(2·${f(s.ef,2)}·${s.mc}·${s.g}·${s.dh}/${s.mp}) = ${f(s.v)} m/s`,
 `v<sub>x</sub> = v·cos ${s.dg}° = ${f(s.vx)} m/s`,
 `v<sub>y</sub> = v·sen ${s.dg}° = ${f(s.vy)} m/s`,
 `t = (v<sub>y</sub> + √(v<sub>y</sub>² + 2gh₀)) / g = ${f(s.tt,2)} s`,
 `R = v<sub>x</sub>·t = ${f(s.R)} m`,
 `h<sub>máx</sub> = h₀ + v<sub>y</sub>²/2g = ${f(s.hm)} m`,
 s.drag?`Arrasto: a = −½ρC<sub>d</sub>A·v·v⃗/m, C<sub>d</sub>=0,47, esfera de raio ${f(s.r*100)} cm`:'Sem resistência do ar'
 ].map(t=>`<div>${t}</div>`).join('');
 const e=fin-s.tg;
 $('hit').style.color=Math.abs(e)<=3?'var(--ok)':'var(--a)';
 $('hit').textContent=Math.abs(e)<=3?'Acertou o alvo!':(e<0?`Faltaram ${f(-e)} m até o alvo`:`Passou ${f(e)} m do alvo`);
}
function size(){const d=devicePixelRatio||1,b=cv.getBoundingClientRect();cv.width=b.width*d;cv.height=b.height*d;cx.setTransform(d,0,0,d,0,0);return[b.width,b.height]}
function draw(now){
 const[W,H]=size(),s=S,css=getComputedStyle(document.documentElement),C=n=>css.getPropertyValue(n).trim();
 const fin=Math.max(s.R,s.drag?s.Rd:0,s.tg),top=Math.max(s.hm,s.hd,s.h0+4,5);
 const m=34,gy=H-28,sc=Math.min((W-m*2)/fin,(gy-16)/top),X=x=>m+x*sc,Y=y=>gy-y*sc;
 cx.clearRect(0,0,W,H);
 let st=[1,2,5,10,20,50,100,200,500,1000].find(q=>q*sc>=44)||1000;
 cx.font='11px system-ui';cx.fillStyle=C('--mut');cx.strokeStyle=C('--line');cx.lineWidth=.5;cx.textAlign='center';
 for(let x=0;x<=fin*1.02;x+=st){cx.beginPath();cx.moveTo(X(x),gy);cx.lineTo(X(x),16);cx.stroke();cx.fillText(x+' m',X(x),gy+16)}
 cx.textAlign='left';for(let y=st;y<=top;y+=st){cx.beginPath();cx.moveTo(m,Y(y));cx.lineTo(W-m+10,Y(y));cx.stroke();cx.fillText(y+' m',4,Y(y)-3)}
 cx.fillStyle=C('--gr');cx.fillRect(0,gy,W,H-gy);
 cx.fillStyle=C('--a');cx.beginPath();cx.moveTo(X(s.tg)-9,gy);cx.lineTo(X(s.tg)+9,gy);cx.lineTo(X(s.tg),gy-16);cx.fill();
 const e=(now-start)/1000,sw=0.9,ts=Math.max(e-sw,0)*Math.max(1,s.tt/8);
 const tf=Math.min(ts,s.tt);
 const L=Math.min(60,Math.max(34,sc*3)),lx=X(0),ly=Y(s.h0),px=lx-L*Math.cos(s.th),py=ly+L*Math.sin(s.th);
 const q=Math.min(e/sw,1),a=(Math.PI+.55)+(s.th-Math.PI-.55)*(1-Math.pow(1-q,2));
 cx.strokeStyle=C('--ink');cx.lineWidth=4;cx.lineCap='round';
 cx.beginPath();cx.moveTo(px-18,gy);cx.lineTo(px,py);cx.lineTo(px+18,gy);cx.moveTo(px,py);cx.lineTo(px,gy);cx.stroke();
 const tx=px+L*Math.cos(a),ty=py-L*Math.sin(a),bx=px-L*.4*Math.cos(a),by=py+L*.4*Math.sin(a);
 cx.lineWidth=5;cx.beginPath();cx.moveTo(bx,by);cx.lineTo(tx,ty);cx.stroke();
 cx.fillStyle=C('--ink');cx.fillRect(bx-9,by,18,16);
 const N=60;cx.lineWidth=2.5;cx.strokeStyle=C('--a');cx.beginPath();
 for(let i=0;i<=N;i++){const t=Math.min(tf,s.tt)*i/N,x=s.vx*t,y=s.h0+s.vy*t-.5*s.g*t*t;i?cx.lineTo(X(x),Y(Math.max(y,0))):cx.moveTo(X(x),Y(y))}cx.stroke();
 let bp=[s.vx*tf,Math.max(s.h0+s.vy*tf-.5*s.g*tf*tf,0)];
 if(s.drag){cx.strokeStyle=C('--b');cx.setLineDash([7,5]);cx.beginPath();const n=Math.min(Math.floor(ts/s.dt),s.P.length-1);
  for(let i=0;i<=n;i+=Math.max(1,Math.floor(s.P.length/300)))i?cx.lineTo(X(s.P[i][0]),Y(s.P[i][1])):cx.moveTo(X(s.P[0][0]),Y(s.P[0][1]));
  cx.stroke();cx.setLineDash([]);bp=s.P[n]}
 const r=Math.max(5,Math.min(9,sc*s.r*3));cx.fillStyle=C('--ink');cx.beginPath();
 if(e<sw)cx.arc(tx,ty,r,0,7);else cx.arc(X(bp[0]),Y(bp[1]),r,0,7);cx.fill();
 const done=ts>=(s.drag?s.td:s.tt);
 if(!done||e<sw+.3)raf=requestAnimationFrame(draw);
}
function fire(){cancelAnimationFrame(raf);calc();start=performance.now();raf=requestAnimationFrame(draw)}
$('go').onclick=fire;
$('th').oninput=()=>{$('thv').textContent=$('th').value+'°';fire()};
document.querySelectorAll('input[type=number],select,#dr').forEach(i=>i.onchange=fire);
addEventListener('resize',()=>{cancelAnimationFrame(raf);start=performance.now()-99999;raf=requestAnimationFrame(draw)});
fire();
</script>
</body>
</html>
